# Codex settings for this repository. Codex reads this file only in a folder you've marked as
# trusted. Setup steps: docs/getting-started.md#codex.

# The ai-standards plugin marketplace: test-bdd, commit and pr. Fetch it with
# `codex plugin marketplace upgrade`. If that finds no Git marketplaces, run
# `codex plugin marketplace add guillempuche/ai-standards` once.
[marketplaces.ai-standards]
source_type = "git"
source = "https://github.com/guillempuche/ai-standards.git"

[plugins."test-bdd@ai-standards"]
enabled = true

[plugins."commit@ai-standards"]
enabled = true

[plugins."pr@ai-standards"]
enabled = true

# The MCP servers Claude Code reads from .mcp.json; keep both lists in step.
# shorts-studio's own server.
[mcp_servers.shorts-studio]
command = "bin/shorts-studio"
args = ["mcp", "serve"]

# Cloudflare, for the R2 bucket that backs up posts. Sign in once per machine with
# `codex mcp login cloudflare` and pick the account.
[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"
