name: Release
# Push a tag like v0.2.0 to publish native binaries (for install.sh and install.ps1) and, when
# the repository variable NPM_PUBLISH is "true", the npm package.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  binaries:
    name: Native binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Bun cross-compiles every platform from this one runner.
      - name: Compile
        run: |
          mkdir -p dist-bin
          for target in darwin-arm64:macos-arm64 darwin-x64:macos-x64 linux-x64:linux-x64 linux-arm64:linux-arm64 windows-x64:windows-x64.exe; do
            bun build src/main.ts --compile --minify --target="bun-${target%%:*}" --outfile "dist-bin/shorts-studio-${target#*:}"
          done
          cd dist-bin && sha256sum shorts-studio-* > checksums.txt
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-bin/* --title "$GITHUB_REF_NAME" --notes-file notes.md
  npm:
    name: npm package
    needs: binaries
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing with provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: npm publish --provenance --access public
