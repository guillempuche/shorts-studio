name: Verification
# Reads the pull request's `## Verification` section and checks it walked every flow the change
# needs (scripts/check-verification.ts). It runs apart from CI because editing the description
# re-runs it, and that shouldn't cancel or repeat the full CI run.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verification:
    name: Verification section
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned by commit SHA, because a tag can be moved to point at new code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The whole history, so the change can be diffed against its base.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
      # The scripts use only Node's own modules, so nothing is installed. The body goes through an
      # environment variable, never into the command line, so its text can't run as a command.
      - run: node scripts/check-verification.ts "origin/${BASE_REF}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
