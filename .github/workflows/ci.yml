name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege: CI only reads the repository and never writes to it.
permissions:
  contents: read
jobs:
  # Always runs, and it's cheap: a leaked credential can hide in a doc as easily as in code.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned by commit SHA, because a tag can be moved to point at new code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint-secrets
  ci:
    name: Check, types, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
      # Fails on an out-of-date lockfile and applies the supply-chain rules in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: node scripts/skills-sync.ts --check
      - run: node scripts/check-links.ts
      # Unit tests use fakes: no API keys, no ffmpeg, no network.
      - run: pnpm test
  # Builds the flake package. If pnpm-lock.yaml changes without the matching hash in
  # nix/package.nix, this job fails (nix build prints the hash to use).
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build .#default --print-build-logs
      - run: ./result/bin/shorts-studio --version
  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npx --yes @fission-ai/openspec@1.16.0 validate --all --strict
